<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 72 72" width="72" height="72">
	<!-- Tools group (5.0, 2026-10-20): a wrench crossed with a screwdriver in a ring, like the other group icons. A placeholder until
	the owner's own icon. -->
	<defs>
		<linearGradient id="toolsWrench" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#d0d7de"/><stop offset="1" stop-color="#57606a"/></linearGradient>
		<linearGradient id="toolsHandle" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f0883e"/><stop offset="1" stop-color="#bc4c00"/></linearGradient>
		<linearGradient id="toolsShaft" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#e1e4e8"/><stop offset="1" stop-color="#8c959f"/></linearGradient>
	</defs>
	<circle cx="36" cy="36" r="33" fill="#f6f8fa" stroke="#d4733a" stroke-width="5"/>
	<g transform="translate(36 36) scale(.92) translate(-36 -36)">
		<!-- screwdriver -->
		<g transform="rotate(45 36 36)">
			<rect x="32.5" y="9" width="7" height="27" rx="2" fill="url(#toolsShaft)"/>
			<path d="M32.5 9 L36 3 L39.5 9 Z" fill="#8c959f"/>
			<rect x="28" y="35" width="16" height="30" rx="6" fill="url(#toolsHandle)"/>
			<rect x="31.5" y="39" width="3" height="22" rx="1.5" fill="#ffffff" opacity=".35"/>
		</g>
		<!-- wrench -->
		<g transform="rotate(-45 36 36)">
			<rect x="31" y="20" width="10" height="46" rx="5" fill="url(#toolsWrench)"/>
			<path d="M36 1 a15 15 0 1 0 0.01 0 Z M30.5 2 h11 v13 h-11 Z" fill="url(#toolsWrench)" fill-rule="evenodd"/>
			<rect x="33.5" y="26" width="2.5" height="34" rx="1.2" fill="#ffffff" opacity=".45"/>
		</g>
	</g>
</svg>
